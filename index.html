    <div id="root">
      <div
        id="wotho-boot-shell"
        style="min-height:100vh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#09090b;color:#fafafa;font-family:'DM Sans',system-ui,-apple-system,sans-serif;text-align:center;"

            alt="Wotho"
            width="44"
            height="44"
            style="width:44px;height:44px;object-fit:contain;opacity:0.95;"
          />
          <div
            id="wotho-boot-loader"
            style="width:120px;height:2px;background:rgba(255,255,255,0.14);border-radius:999px;overflow:hidden;position:relative;"
          >
            <div
              style="position:absolute;inset:0;width:45%;background:#6366f1;border-radius:999px;animation:wothoBootSlide 1.15s ease-in-out infinite;"
            ></div>
          </div>
          <p
            id="wotho-boot-status"
            style="margin:0;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(250,250,250,0.65);"
          >
            Carregando Wotho…
          </p>
          <div id="wotho-boot-offline" style="display:none;flex-direction:column;align-items:center;gap:12px;margin-top:4px;">
            <p style="margin:0;font-size:13px;line-height:1.5;color:rgba(250,250,250,0.72);">
              Não foi possível carregar a plataforma. Verifique sua conexão com a internet e tente novamente.
            </p>
            <button
              type="button"
              onclick="window.location.reload()"
              style="padding:9px 22px;border-radius:999px;border:1px solid rgba(255,255,255,0.22);background:rgba(255,255,255,0.08);color:#fff;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;font-family:inherit;"
            >
              Tentar novamente
            </button>
          </div>
        </div>
        <style>
          @keyframes wothoBootSlide {
            0% { transform: translateX(-110%); }
            100% { transform: translateX(240%); }
          }
        </style>
      </div>
    </div>
    <noscript>
      <main style="max-width:720px;margin:64px auto;padding:24px;font-family:'DM Sans',sans-serif;color:#18181b;">
        <h1>Wotho — Livros, notícias globais, streaming e webtoons</h1>
        <p>Ative o JavaScript no seu navegador para acessar a plataforma Wotho.</p>
      </main>
    </noscript>
    <script>
      (function () {
        var showOfflineState = function () {
          if (window.__WOTHO_APP_MOUNTED__) return;
          var loader = document.getElementById("wotho-boot-loader");
          var status = document.getElementById("wotho-boot-status");
          var offline = document.getElementById("wotho-boot-offline");
          if (loader) loader.style.display = "none";
          if (status) {
            status.textContent = navigator.onLine === false ? "Sem conexão com a internet" : "Conexão instável";
          }
          if (offline) offline.style.display = "flex";
        };

        if (navigator.onLine === false) {
          setTimeout(showOfflineState, 1200);
        }

        window.addEventListener("offline", function () {
          if (!window.__WOTHO_APP_MOUNTED__) showOfflineState();
        });

        window.addEventListener(
          "error",
          function (e) {
            if (window.__WOTHO_APP_MOUNTED__) return;
            var target = e && e.target;
            if (target && (target.tagName === "SCRIPT" || target.tagName === "LINK")) {
              showOfflineState();
            }
          },
          true
        );

        setTimeout(function () {
          if (!window.__WOTHO_APP_MOUNTED__ && navigator.onLine === false) {
            showOfflineState();
          }
        }, 4500);
      })();
    </script>
